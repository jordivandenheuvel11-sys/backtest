<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NQ / ES Replay Backtester</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>NQ / ES Replay Backtester</h1>

  <div class="field">
    <label for="datasetSelect">Dataset</label>
    <select id="datasetSelect"></select>
  </div>

  <div class="field">
    <label for="contractSelect">Contract</label>
    <select id="contractSelect"></select>
  </div>

  <div class="field">
    <label for="capitalInput">Starting capital</label>
    <input id="capitalInput" type="number" value="50000" step="1000" />
  </div>

  <div class="field">
    <label for="commissionInput">Commission /side</label>
    <input id="commissionInput" type="number" value="0" step="0.5" min="0" />
  </div>

  <button id="resetBtn" class="btn btn-secondary" title="Reload the dataset and clear all trades">Reset session</button>
  <span id="datasetInfo" class="dataset-info"></span>
</header>

<main class="layout">
  <section class="chart-col">
    <div id="priceChart" class="chart price-chart"></div>
    <div id="equityChart" class="chart equity-chart"></div>

    <div class="replay-bar">
      <button id="toStartBtn" class="btn" title="Rewind to the very first bar">|&laquo;</button>
      <button id="stepBackBtn" class="btn" title="Rewind one bar (only while flat)">&laquo;</button>
      <button id="playBtn" class="btn btn-primary">&#9654; Play</button>
      <button id="pauseBtn" class="btn" disabled>&#10074;&#10074; Pause</button>
      <button id="stepFwdBtn" class="btn" title="Step forward one bar">&raquo;</button>
      <button id="stepFwd10Btn" class="btn" title="Step forward 10 bars">&raquo;&raquo;</button>
      <select id="speedSelect">
        <option value="800">0.5x</option>
        <option value="400" selected>1x</option>
        <option value="150">3x</option>
        <option value="50">10x</option>
      </select>
      <input id="seekSlider" type="range" min="0" max="0" value="0" />
      <span id="seekLabel" class="seek-label">no data loaded</span>
    </div>
  </section>

  <aside class="side-col">
    <div class="panel">
      <h2>Place order</h2>
      <div class="row">
        <button id="buyBtn" class="btn btn-buy">Buy</button>
        <button id="sellBtn" class="btn btn-sell">Sell</button>
      </div>
      <div class="row">
        <label>Qty <input id="qtyInput" type="number" value="1" min="1" step="1" /></label>
        <label>Type
          <select id="orderTypeSelect">
            <option value="market">Market</option>
            <option value="limit">Limit</option>
            <option value="stop">Stop</option>
          </select>
        </label>
      </div>
      <div class="row" id="priceRow" style="display:none">
        <label>Price <input id="orderPriceInput" type="number" step="0.25" /></label>
      </div>
      <div class="row">
        <label>Stop-loss <input id="slInput" type="number" step="0.25" placeholder="price (optional)" /></label>
        <label>Take-profit <input id="tpInput" type="number" step="0.25" placeholder="price (optional)" /></label>
      </div>
      <p class="hint">Market orders fill at the last revealed bar's close. Limit/Stop orders fill once a later bar's range crosses your price.</p>
    </div>

    <div class="panel">
      <h2>Position</h2>
      <div id="positionBox" class="mono">Flat</div>
      <div id="pendingOrdersBox" class="mono"></div>
      <button id="closePosBtn" class="btn btn-secondary" disabled>Close position</button>
    </div>

    <div class="panel">
      <h2>Account</h2>
      <div id="accountBox" class="mono"></div>
    </div>

    <div class="panel">
      <h2>Stats</h2>
      <div id="statsBox" class="mono"></div>
    </div>

    <div class="panel panel-grow">
      <h2>Trade log</h2>
      <div class="table-wrap">
        <table id="tradeTable">
          <thead>
            <tr><th>Side</th><th>Qty</th><th>Entry</th><th>Exit</th><th>Pts</th><th>P&amp;L</th><th>Reason</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </aside>
</main>

<footer class="statusbar">
  <span id="statusMsg"></span>
</footer>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
